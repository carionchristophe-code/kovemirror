name: Build KoveMirror APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Donner les droits d'exécution à Gradle
        run: chmod +x gradlew

      - name: Compilation de l'APK (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Sauvegarder et publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: KoveMirror-Fork-FR-Test
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
